<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beauty Glam · Reserva tu cita</title>
<meta name="description" content="Reserva tu cita en el salón en segundos.">
<meta name="theme-color" content="#17110e">
<link rel="icon" href="image.jpg">
<link rel="apple-touch-icon" href="image.jpg">
<meta property="og:image" content="image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17110e; --card: #221915; --card2: #2e231e; --line: #403128;
    --txt: #f6efea; --sub: #c4b1a6; --acc: #cfb2a5; --acc-txt: #2b170f;
    --ok: #2fbf71; --err: #ff6b6b; --wa: #25d366;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); font: 15px/1.45 Inter, system-ui, sans-serif; }
  button, input { font: inherit; color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 96px; }

  header { padding: 22px 16px 8px; text-align: center; background:
    linear-gradient(90deg, #7a5f52, #cfb2a5, #7a5f52) top / 100% 4px no-repeat; }
  .logo { margin: 6px auto 0; }
  .logo img { width: min(240px, 64vw); height: auto; display: block; margin: 0 auto; }
  .lema { color: var(--sub); font-size: 13px; margin-top: 2px; }

  nav { position: sticky; top: 0; z-index: 5; background: rgba(1,1,1,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  nav .wrap { display: flex; gap: 6px; padding: 10px 16px; }
  nav button { flex: 1; border: 0; background: transparent; padding: 10px 6px; border-radius: 10px; color: var(--sub); font-weight: 600; cursor: pointer; }
  nav button.on { background: var(--acc); color: var(--acc-txt); }

  h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; letter-spacing: .2px; font-size: 29px; margin: 22px 0 10px; }
  h2 small { display: block; margin: 2px 0 0 !important; font-weight: 400; font-family: Inter, sans-serif; font-size: 13px; color: var(--sub); letter-spacing: 0; margin-left: 6px; }
  .grid { display: grid; gap: 8px; }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left;
         background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
  .opt b { font-weight: 600; }
  .opt .meta { color: var(--sub); font-size: 13px; white-space: nowrap; }
  .opt-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .opt .desc { color: var(--sub); font-size: 13px; font-weight: 400; }
  .opt.on { border-color: var(--acc); background: #33251f; }
  .barb { display: flex; gap: 12px; align-items: center; width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; }
  .barb.on { border-color: var(--acc); background: #33251f; }
  .barb .foto { flex: 0 0 60px; width: 60px; height: 60px; border-radius: 50%; background: #2e231e center / cover no-repeat; border: 2px solid var(--acc);
                display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 26px; color: var(--acc); }
  .barb .datos { flex: 1; min-width: 0; }
  .barb .datos b { display: block; font-size: 16px; }
  .barb .dir { color: var(--sub); font-size: 13px; }
  .mapa { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--acc); text-decoration: none; border: 1px solid #7a5f52; border-radius: 8px; padding: 4px 9px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; min-width: 64px; text-align: center; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; cursor: pointer; }
  .chip small { display: block; color: var(--sub); font-size: 11px; text-transform: uppercase; }
  .chip b { font-size: 18px; }
  .chip.on { border-color: var(--acc); background: #33251f; }
  .chip:disabled { opacity: .35; cursor: default; }
  .horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .horas .chip { min-width: 0; padding: 10px 4px; font-weight: 600; }

  label { display: block; font-size: 13px; color: var(--sub); margin: 12px 0 5px; }
  input, textarea { width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 14px; outline: none; font: inherit; color: inherit; }
  input:focus, textarea:focus { border-color: var(--acc); }
  textarea { resize: vertical; min-height: 76px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px; font-weight: 700; font-size: 16px; cursor: pointer;
         background: var(--acc); color: var(--acc-txt); margin-top: 16px; text-align: center; text-decoration: none; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.sec { background: var(--card2); color: var(--txt); }
  .btn.wa { background: var(--wa); color: #06210f; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 12px; }
  .resumen div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .resumen div:last-child { border: 0; }
  .resumen span { color: var(--sub); }
  .resumen .item span { color: var(--txt); display: flex; flex-direction: column; gap: 1px; }
  .resumen .item small { color: var(--sub); font-size: 12px; }
  .resumen .item b { white-space: nowrap; }
  .resumen .cab-serv { color: var(--sub); font-size: 13px; border: 0; padding-bottom: 0; }
  .ok { border-color: #1f6b43; background: #10261a; }
  .err { color: var(--err); font-size: 14px; margin-top: 10px; }
  .muted { color: var(--sub); font-size: 13px; }
  .codigo { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 40px; letter-spacing: 2px; color: var(--acc); line-height: 1.1; }
  .aviso { border: 1px solid #7a5f52; background: #261b17; color: #ead8cf; border-radius: 12px; padding: 12px 14px; font-size: 13px; margin-top: 22px; }
  .plan h3 { margin: 0; font-size: 18px; }
  .plan .precio { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 34px; color: var(--acc); line-height: 1; margin: 6px 0; }
  .plan ul { margin: 8px 0 0; padding-left: 18px; color: var(--sub); }
  .info { color: var(--sub); font-size: 13px; text-align: center; margin-top: 28px; }
  .info a { color: var(--sub); }
  .soporte { position: fixed; right: 16px; bottom: 18px; z-index: 6; background: var(--wa); color: #06210f; border-radius: 30px; padding: 12px 16px; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  .cargando { color: var(--sub); padding: 30px 0; text-align: center; }
  .carrusel { position: relative; margin-top: 10px; }
  .pista { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: 14px; background: var(--card); }
  .pista::-webkit-scrollbar { display: none; }
  .pista img { flex: 0 0 100%; width: 100%; aspect-ratio: 4 / 5; max-height: 560px; object-fit: cover; scroll-snap-align: center; display: block; }
  .pista.vacia { justify-content: center; align-items: center; aspect-ratio: 4 / 5; max-height: 560px; color: var(--sub); font-size: 14px; }
  .flecha { position: absolute; top: calc(50% - 12px); transform: translateY(-50%); width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 28px; line-height: 1; cursor: pointer; }
  .flecha.izq { left: 8px; } .flecha.der { right: 8px; }
  .puntos { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
  .puntos span { width: 7px; height: 7px; border-radius: 50%; background: #444; }
  .puntos span.on { background: var(--acc); }
  .asig { margin-top: 10px; }
  .asig .pros { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .pro { border: 1px solid var(--line); background: transparent; color: var(--txt); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .pro.on { border-color: var(--acc); background: var(--acc); color: #1b1310; font-weight: 600; }
  .acc-serv { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
  .btn-agregar { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border: 2px dashed var(--acc); border-radius: 14px;
    background: rgba(207, 178, 165, .08); color: var(--txt); font: inherit; text-align: left; cursor: pointer; }
  .btn-agregar:hover, .btn-agregar:focus-visible { background: rgba(207, 178, 165, .16); }
  .btn-agregar .mas { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--acc); color: var(--acc-txt);
    display: grid; place-items: center; font-size: 28px; font-weight: 700; line-height: 1; }
  .btn-agregar b { display: block; font-size: 16px; }
  .btn-agregar small { color: var(--sub); font-size: 13px; }
  .acc-serv .link { align-self: flex-start; }
  .acc-serv.final { margin: 14px 0 6px; }
  .opt.elegido { cursor: default; }
  .link { background: none; border: 0; color: var(--acc); cursor: pointer; padding: 10px 0 0; font-weight: 600; font-size: 14px; }
  .hidden { display: none !important; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 4px; margin-bottom: 10px; }
  .cats::-webkit-scrollbar { display: none; }
  .cat { flex: 0 0 auto; border: 1.5px solid var(--line); background: var(--card); color: var(--sub); border-radius: 999px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
  .cat.on { background: var(--acc); border-color: var(--acc); color: var(--acc-txt); }
  .opt { justify-content: flex-start; }
  .opt .opt-txt { flex: 1; }
  .opt .meta { text-align: right; line-height: 1.35; }
  .check { flex: 0 0 24px; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--acc-txt); }
  .opt.on .check { background: var(--acc); border-color: var(--acc); }
  .badge { align-self: flex-start; margin-top: 4px; font-size: 11px; font-weight: 600; color: var(--acc); border: 1px solid #7a5f52; border-radius: 999px; padding: 2px 8px; }
  .total { border-color: #7a5f52; }
  .lista-elegidos { display: flex; flex-wrap: wrap; gap: 6px; }
  .lista-elegidos .tag { background: var(--card2); border-radius: 999px; padding: 4px 4px 4px 11px; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
  .lista-elegidos .tag button { border: 0; background: transparent; color: var(--sub); font-size: 17px; line-height: 1; cursor: pointer; padding: 0 6px; }
  .suma { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 10px 0 4px; }
  .suma b { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 28px; color: var(--acc); }
  .abono { border-color: #7a5f52; background: #261b17; }
  .abono p { margin: 8px 0 0; }
  .portada { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 12 / 5; margin: 0 0 10px; background: var(--card); border: 1px solid var(--line); }
  .portada img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .portada::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(23,17,14,0) 45%, rgba(23,17,14,.85)); }
  .portada span { position: absolute; left: 16px; bottom: 10px; z-index: 1; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; font-weight: 700; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .opt .mini { position: relative; flex: 0 0 68px; width: 68px; height: 68px; border-radius: 10px; overflow: hidden; background: var(--card2); }
  .opt .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .opt .mini .check { position: absolute; top: 5px; left: 5px; width: 22px; height: 22px; flex: none; background: rgba(23,17,14,.72); border-color: rgba(246,239,234,.55); }
  .opt.on .mini { outline: 2px solid var(--acc); outline-offset: -2px; }
  @media (prefers-reduced-motion: no-preference) { .vista { animation: entra .18s ease-out; } @keyframes entra { from { opacity: 0; transform: translateY(4px); } } }
</style>
</head>
<body>
<header>
  <h1 class="logo"><img src="logo.png" alt="Beauty Glam by Nathaly Torres" width="520" height="520"></h1>
  <div class="lema" id="lema"></div>
</header>
<nav><div class="wrap">
  <button data-tab="reservar" class="on">Reservar</button>
  <button data-tab="micita">Mi cita</button>
  <button data-tab="planes">Planes</button>
</div></nav>

<main class="wrap">
  <section id="v-reservar" class="vista"><div class="cargando">Cargando…</div></section>
  <section id="v-micita" class="vista hidden"></section>
  <section id="v-planes" class="vista hidden"></section>

  <div class="aviso"><b>Aviso:</b> solo pedimos abono en los servicios que lo indican, y solo a los datos que aparecen en esta página al reservar. Nunca te pedimos claves ni datos de tu banco. Si alguien te escribe desde otro número pidiendo dinero, no somos nosotros.</div>
  <div class="info" id="info"></div>
</main>
<a class="soporte hidden" id="soporte" target="_blank" rel="noopener">WhatsApp</a>

<script>
/* Dirección de la API (Apps Script → Implementar → Aplicación web). */
const API = 'https://script.google.com/macros/s/AKfycbxdYsJMpAHYGTf5ObuPCoIRMS4yYKSpGW1SMGNja7iLVml2JO9O4btmWzf46nWLR7EdDA/exec';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pesos = v => '$' + Math.round(v || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const guardar = (k, v) => { try { localStorage.setItem('bglam_' + k, JSON.stringify(v)); } catch (e) {} };
const leerLS = k => { try { return JSON.parse(localStorage.getItem('bglam_' + k)); } catch (e) { return null; } };

let D = null;               // datos del negocio
const R = { servicios: [], cat: null, profesional: null, fecha: null, hora: null, horaCon: '', notas: '', asig: {}, plan: null };

/* Llamadas a la API con reintentos (tras publicar, Google responde error unos minutos). */
async function api(params, post) {
  let ultimo;
  for (let i = 0; i < 5; i++) {
    try {
      const r = post
        ? await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(params) })
        : await fetch(API + '?' + new URLSearchParams(params));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (!j.ok) { const e = new Error(j.error || 'Error'); e.final = true; throw e; }
      return j;
    } catch (e) {
      if (e.final) throw e;
      ultimo = e;
      await new Promise(res => setTimeout(res, 800 * (i + 1)));
    }
  }
  throw new Error('No pudimos conectar. Revisa tu internet e inténtalo de nuevo.');
}

const waLink = (tel, txt) => 'https://wa.me/' + tel + '?text=' + encodeURIComponent(txt);
function fechaISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function deISO(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function cerrado(h) { return !/^\d{1,2}:\d{2}-\d{1,2}:\d{2}$/.test(String(h).trim()); }
function hora12(h) { const [a, b] = h.split(':').map(Number); return (a % 12 || 12) + ':' + String(b).padStart(2, '0') + (a < 12 ? ' a. m.' : ' p. m.'); }

/* ---------- Pestañas ---------- */
function tab(nombre) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === nombre));
  ['reservar', 'micita', 'planes'].forEach(t => $('#v-' + t).classList.toggle('hidden', t !== nombre));
  if (nombre === 'micita' && !$('#v-micita').innerHTML) vistaMiCita();
  if (nombre === 'planes') vistaPlanes();
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => tab(b.dataset.tab));

/* ---------- Reservar ---------- */
let FOTOS = leerLS('fotos') || {}; // { B01: { v: versión, src: 'data:image/...' } }

function fotoHtml(b) {
  const f = FOTOS[b.id];
  const ok = b.foto && f && f.v === b.foto && /^data:image\//.test(f.src);
  return ok
    ? `<div class="foto" data-foto="${esc(b.id)}" role="img" aria-label="Foto de ${esc(b.nombre)}" style="background-image:url('${f.src}')"></div>`
    : `<div class="foto" data-foto="${esc(b.id)}" aria-hidden="true">${esc(String(b.nombre || '?').trim().charAt(0).toUpperCase())}</div>`;
}

async function cargarFotos() {
  const falta = D.profesionales.some(b => b.foto && (!FOTOS[b.id] || FOTOS[b.id].v !== b.foto));
  if (!falta) return;
  try {
    const r = await api({ a: 'fotos' });
    const nuevo = {};
    D.profesionales.forEach(b => { if (b.foto && r.fotos[b.id]) nuevo[b.id] = { v: b.foto, src: r.fotos[b.id] }; });
    FOTOS = nuevo;
    guardar('fotos', FOTOS);
    document.querySelectorAll('[data-foto]').forEach(el => {
      const b = D.profesionales.find(x => x.id === el.dataset.foto);
      if (b) el.outerHTML = fotoHtml(b);
    });
  } catch (e) { /* sin fotos, quedan las iniciales */ }
}

/* ---------- Fotos de servicios y portadas (las sube la administración) ---------- */
let FSV = leerLS('fotosServ') || {}; // { S01: { v, src }, 'cat:Uñas': { v, src } }
const SLUGS = { cabello: 'cabello', color: 'color', unas: 'unas', cejas: 'cejas', maquillaje: 'maquillaje', facial: 'facial', depilacion: 'depilacion', pestanas: 'cejas', pedi: 'facial' };
function ilustracion(cat) {
  const k = String(cat || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().split(/[^a-z]/)[0];
  return 'img/cat-' + (SLUGS[k] || 'otros') + '.svg';
}
function fotoGuardada(k) {
  const v = (D && D.fotosServ || {})[k];
  return v && FSV[k] && FSV[k].v === v && /^data:image\//.test(FSV[k].src) ? FSV[k].src : '';
}
/** Foto del servicio → portada de su categoría → ilustración de la categoría. */
function srcFoto(k, cat) { return fotoGuardada(k) || (cat ? fotoGuardada('cat:' + cat) : '') || ilustracion(cat); }
const imgFoto = (k, cat, alt, perezosa) => `<img data-fk="${esc(k)}" data-cat="${esc(cat || '')}" src="${esc(srcFoto(k, cat))}" alt="${esc(alt)}"${perezosa ? ' loading="lazy"' : ''}>`;
function refrescarFotos() { document.querySelectorAll('img[data-fk]').forEach(el => { const s = srcFoto(el.dataset.fk, el.dataset.cat); if (el.getAttribute('src') !== s) el.src = s; }); }

let cargandoFS = false;
async function cargarFotosServ() {
  if (cargandoFS || !D || !D.fotosServ) return;
  cargandoFS = true;
  Object.keys(FSV).forEach(k => { if (!D.fotosServ[k]) delete FSV[k]; });
  // Primero las de la categoría abierta, luego las demás.
  const cat = R.cat || (D.categorias || [])[0];
  const enCat = k => k === 'cat:' + cat || D.servicios.some(s => s.id === k && s.cat === cat);
  const faltan = Object.keys(D.fotosServ).filter(k => !fotoGuardada(k)).sort((a, b) => enCat(b) - enCat(a));
  try {
    for (let i = 0; i < faltan.length; i += 3) {
      const lote = faltan.slice(i, i + 3);
      const r = await api({ a: 'fotosServ', k: lote.join(',') });
      lote.forEach(k => { if (r.fotos[k]) FSV[k] = { v: D.fotosServ[k], src: r.fotos[k] }; });
      refrescarFotos();
    }
  } catch (e) { /* quedan las ilustraciones */ }
  guardar('fotosServ', FSV);
  cargandoFS = false;
}

const mapaBtn = b => b.mapa ? `<a class="mapa" href="${esc(b.mapa)}" target="_blank" rel="noopener" data-mapa>Cómo llegar ↗</a>` : '';

const GAL = {}; // fotos de trabajos por profesional: id -> [{ id, src }] | 'cargando'

function galeriaHtml(b) {
  const f = GAL[b.id];
  if (f === undefined) cargarGaleria(b);
  if (!Array.isArray(f)) return '<div class="pista vacia">Cargando fotos…</div>';
  if (!f.length) return '';
  return `<div class="pista" id="pista" tabindex="0" aria-label="Trabajos de ${esc(b.nombre)}">${f.map((x, i) =>
      `<img src="${x.src}" alt="Trabajo ${i + 1} de ${esc(b.nombre)}"${i ? ' loading="lazy"' : ''}>`).join('')}</div>` +
    (f.length > 1 ? `<button class="flecha izq" data-dir="-1" aria-label="Foto anterior">‹</button><button class="flecha der" data-dir="1" aria-label="Foto siguiente">›</button>
      <div class="puntos">${f.map((x, i) => `<span class="${i ? '' : 'on'}"></span>`).join('')}</div>` : '');
}

async function cargarGaleria(b) {
  GAL[b.id] = 'cargando';
  try { const r = await api({ a: 'galeria', b: b.id }); GAL[b.id] = r.fotos.filter(x => /^data:image\//.test(x.src)); }
  catch (e) { GAL[b.id] = []; }
  const caja = $('#galeria');
  if (R.profesional === b.id && caja) {
    if (GAL[b.id].length) { caja.innerHTML = galeriaHtml(b); iniciarCarrusel(); } else caja.remove();
  }
}

function iniciarCarrusel(pos) {
  const p = $('#pista');
  if (!p) return;
  if (pos) p.scrollLeft = pos;
  const puntos = document.querySelectorAll('.puntos span');
  const actual = () => Math.round(p.scrollLeft / (p.clientWidth || 1));
  const marcar = () => puntos.forEach((s, i) => s.classList.toggle('on', i === actual()));
  p.onscroll = marcar;
  marcar();
  document.querySelectorAll('.flecha').forEach(b => b.onclick = () => {
    const n = p.children.length, i = (actual() + Number(b.dataset.dir) + n) % n;
    p.scrollTo({ left: i * p.clientWidth, behavior: 'smooth' });
  });
}

const dur = m => m >= 60 ? Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '') : m + ' min';
const precioTxt = (v, variable) => (variable ? 'desde ' : '') + pesos(v);

/** Suma de los servicios elegidos. */
function elegidos() {
  const l = R.servicios.map(id => D.servicios.find(s => s.id === id)).filter(Boolean);
  // Cada profesional puede tardar distinto: se usa su duración cuando ya se sabe quién atiende.
  const pr = D.profesionales.find(b => R.profesional && R.profesional !== '*' ? b.id === R.profesional : (R.horaCon && b.nombre === R.horaCon));
  const md = (pr && pr.duraciones) || {};
  return { l, precio: l.reduce((t, s) => t + s.precio, 0), dur: l.reduce((t, s) => t + (md[s.id] || s.dur), 0),
    abono: l.reduce((t, s) => t + (s.abono || 0), 0), variable: l.some(s => s.variable) };
}

/** "13:00", "1:00 p. m." → minutos. */
function aMinW(h) {
  const m = String(h || '').match(/(\d{1,2}):(\d{2})\s*([ap])?/i);
  if (!m) return null;
  let a = Number(m[1]);
  const x = (m[3] || '').toLowerCase();
  if (x === 'p' && a < 12) a += 12;
  if (x === 'a' && a === 12) a = 0;
  return a * 60 + Number(m[2]);
}
const deMin = t => String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');

/** Los servicios de la cita uno detrás de otro (sin solaparse), con la profesional que atiende:
 *  [{ s, ini, fin, min }] en minutos. La duración es la de esa profesional. */
function turnosCita(E, nombrePro, hora) {
  const pr = D.profesionales.find(b => b.nombre === nombrePro);
  const md = (pr && pr.duraciones) || {};
  let t = aMinW(hora) || 0;
  return E.l.map(s => { const min = md[s.id] || s.dur, ini = t; t += min; return { s, ini, fin: t, min }; });
}
const rangoTxt = (a, b) => hora12(deMin(a)) + ' – ' + hora12(deMin(b));

/** Filas del resumen: cada servicio con su profesional, su hora de inicio y fin, y su precio. */
function filasServicios(E, nombrePro, hora) {
  const l = turnosCita(E, nombrePro, hora);
  const quien = nombrePro && nombrePro !== 'La primera disponible' ? esc(nombrePro) + ' · ' : '';
  return (l.length > 1 ? `<div class="cab-serv">${l.length} servicios, uno después del otro</div>` : '') +
    l.map(x => `<div class="item"><span>${esc(x.s.nombre)}<small>${quien}${rangoTxt(x.ini, x.fin)} (${dur(x.min)})</small></span><b>${precioTxt(x.s.precio, x.s.variable)}</b></div>`).join('');
}
/** Filas del resumen desde segmentos [{ servicio, profesional, hora, fin, precio, variable }]. */
function filasSeg(segs) {
  return (segs.length > 1 ? `<div class="cab-serv">${segs.length} servicios, uno después del otro</div>` : '') +
    segs.map(x => `<div class="item"><span>${esc(x.servicio)}<small>${esc(x.profesional)} · ${rangoTxt(aMinW(x.hora), aMinW(x.fin))} (${dur(aMinW(x.fin) - aMinW(x.hora))})</small></span><b>${precioTxt(x.precio, x.variable)}</b></div>`).join('');
}
const cuandoSeg = (fechaTxt, segs) => fechaTxt + ', ' + rangoTxt(aMinW(segs[0].hora), aMinW(segs[segs.length - 1].fin));
/** Plan del servidor ([{ s, p, nombre, servicio, hora, fin }]) → segmentos con precio. */
const segDePlan = plan => plan.map(x => { const sv = D.servicios.find(y => y.id === x.s) || {}; return { servicio: x.servicio, profesional: x.nombre, hora: x.hora, fin: x.fin, precio: sv.precio || 0, variable: !!sv.variable }; });

/** "jueves 22 de octubre, 1:00 p. m. – 5:00 p. m." */
function cuandoTxt(fechaTxt, E, nombrePro, hora) {
  const l = turnosCita(E, nombrePro, hora);
  return fechaTxt + ', ' + (l.length ? rangoTxt(l[0].ini, l[l.length - 1].fin) : hora12(deMin(aMinW(hora) || 0)));
}

/** Profesionales que hacen TODOS los servicios elegidos. */
function capaces() { return D.profesionales.filter(b => R.servicios.every(id => (b.servicios || []).indexOf(id) >= 0)); }

function vistaReservar() {
  const v = $('#v-reservar');
  R.servicios = R.servicios.filter(id => D.servicios.some(s => s.id === id));
  const E = elegidos();
  const multi = E.l.length > 1; // varios servicios: cada uno con su profesional, uno detrás de otro
  const aptas = R.servicios.length && !multi ? capaces() : [];
  if (multi) {
    Object.keys(R.asig).forEach(id => { if (R.servicios.indexOf(id) < 0) delete R.asig[id]; });
    // La profesional que la clienta ya eligió se mantiene para los servicios que agregue (si los hace).
    const conHora = R.horaCon ? (D.profesionales.find(b => b.nombre === R.horaCon) || {}).id : '';
    const elegidas = R.servicios.map(id => R.asig[id]).filter(x => x && x !== '*');
    const pref = elegidas.length ? elegidas[elegidas.length - 1] : (R.profesional && R.profesional !== '*' ? R.profesional : conHora || '');
    R.servicios.forEach(id => {
      const ok = D.profesionales.filter(b => (b.servicios || []).indexOf(id) >= 0);
      if (!R.asig[id] || (R.asig[id] !== '*' && !ok.some(b => b.id === R.asig[id])))
        R.asig[id] = pref && ok.some(b => b.id === pref) ? pref : ok.length === 1 ? ok[0].id : '*';
    });
  }
  if (!multi && R.profesional && R.profesional !== '*' && !aptas.some(b => b.id === R.profesional)) { R.profesional = null; R.fecha = null; R.hora = null; }
  if (!multi && R.profesional === '*' && aptas.length < 2) R.profesional = aptas.length === 1 ? aptas[0].id : null;
  const barb = D.profesionales.find(b => b.id === R.profesional);

  // 1 · Servicios por categoría
  // Con un servicio elegido la lista se cierra: solo queda lo elegido y las profesionales que lo hacen.
  const abierta = !E.l.length || R.agregando;
  let html = '<h2 id="paso1">1 · ¿Qué te vas a hacer?</h2>';
  const cats = (D.categorias && D.categorias.length ? D.categorias : ['Servicios']);
  if (abierta) {
  if (R.agregando) html += '<p class="muted">Elige el servicio que quieres sumar a la misma cita. <button class="link" id="no-agregar">Cancelar</button></p>';
  if (!R.cat || cats.indexOf(R.cat) < 0) R.cat = cats[0];
  html += '<div class="cats" role="tablist">' + cats.map(c => `<button class="cat ${c === R.cat ? 'on' : ''}" data-cat="${esc(c)}">${esc(c)}${R.servicios.some(id => (D.servicios.find(s => s.id === id) || {}).cat === c) ? ' •' : ''}</button>`).join('') + '</div>';
  const enCat = D.servicios.filter(s => (D.categorias && D.categorias.length ? s.cat === R.cat : true))
    // Al agregar otro servicio, solo los que alguna profesional puede hacer junto con lo ya elegido.
    .filter(s => !R.agregando || R.servicios.indexOf(s.id) >= 0 || D.profesionales.some(b => (b.servicios || []).indexOf(s.id) >= 0));
  if (D.categorias && D.categorias.length) html += `<div class="portada">${imgFoto('cat:' + R.cat, R.cat, R.cat)}<span>${esc(R.cat)}</span></div>`;
  html += '<div class="grid">' + enCat.map(s => {
    const on = R.servicios.indexOf(s.id) >= 0;
    return `<button class="opt ${on ? 'on' : ''}" data-s="${esc(s.id)}" aria-pressed="${on}">
      <span class="mini">${imgFoto(s.id, s.cat, s.nombre, true)}<span class="check" aria-hidden="true">${on ? '✓' : ''}</span></span>
      <span class="opt-txt"><b>${esc(s.nombre)}</b>${s.desc ? `<span class="desc">${esc(s.desc)}</span>` : ''}
        ${s.abono ? `<span class="badge">Abono ${pesos(s.abono)} para reservar</span>` : ''}</span>
      <span class="meta">${precioTxt(s.precio, s.variable)}<br>${dur(s.dur)}</span></button>`;
  }).join('') + '</div>';
  }
  if (E.l.length && !R.agregando) {
    html += '<div class="grid">' + E.l.map(s => `<div class="opt on elegido">
      <span class="mini">${imgFoto(s.id, s.cat, s.nombre, true)}<span class="check" aria-hidden="true">✓</span></span>
      <span class="opt-txt"><b>${esc(s.nombre)}</b>${s.desc ? `<span class="desc">${esc(s.desc)}</span>` : ''}</span>
      <span class="meta">${precioTxt(s.precio, s.variable)}<br>${dur(s.dur)}</span></div>`).join('') + '</div>';
    html += `<div class="acc-serv">${E.l.length < 6 ? `<button class="btn-agregar" id="agregar-serv" data-agregar><span class="mas" aria-hidden="true">+</span>
      <span><b>Agregar otro servicio</b><small>${E.l.length === 1 ? '¿También uñas, pies, cejas…? Súmalo a la misma visita' : 'Puedes sumar hasta 6 servicios en la misma visita'}</small></span></button>` : ''}
      <button class="link" id="cambiar-serv">← ${E.l.length > 1 ? 'Empezar de nuevo' : 'Cambiar servicio'}</button></div>`;
  }
  if (E.l.length && !R.agregando) {
    html += `<div class="card total">
      ${E.l.length < 2 ? '' : `<div class="lista-elegidos">${E.l.map(s => `<span class="tag">${esc(s.nombre)} <button data-quitar="${esc(s.id)}" aria-label="Quitar ${esc(s.nombre)}">×</button></span>`).join('')}</div>`}
      <div class="suma"><span>${E.l.length} ${E.l.length === 1 ? 'servicio' : 'servicios'} · ${dur(E.dur)}</span><b>${precioTxt(E.precio, E.variable)}</b></div>
      ${E.abono ? `<div class="muted">Para confirmar esta cita se pide un abono de <b>${pesos(E.abono)}</b>, que se descuenta del total.</div>` : ''}
      <label for="notas">Notas para tu cita (opcional)</label>
      <textarea id="notas" maxlength="300" rows="3" placeholder="Ej.: tengo el cabello largo, quiero un tono más claro, soy alérgica a…">${esc(R.notas || '')}</textarea>
    </div>`;
  }

  // 2 · Profesional: con varios servicios, una por servicio
  const multiOk = multi && E.l.every(s => D.profesionales.some(b => (b.servicios || []).indexOf(s.id) >= 0));
  if (multi && !R.agregando) {
    html += '<h2 id="paso2">2 · ¿Con quién? <small>elige para cada servicio</small></h2>';
    html += E.l.map((s, i) => {
      const ok = D.profesionales.filter(b => (b.servicios || []).indexOf(s.id) >= 0);
      if (!ok.length) return `<div class="card asig"><b>${i + 1}. ${esc(s.nombre)}</b><p class="muted">Ninguna profesional hace este servicio. Quítalo para continuar.</p></div>`;
      const ops = (ok.length > 1 ? [{ id: '*', nombre: 'La que esté libre' }] : []).concat(ok);
      return `<div class="card asig"><b>${i + 1}. ${esc(s.nombre)}</b><div class="pros">${ops.map(b =>
        `<button class="pro ${R.asig[s.id] === b.id ? 'on' : ''}" data-asig="${esc(s.id)}" data-pro="${esc(b.id)}" aria-pressed="${R.asig[s.id] === b.id}">${esc(b.nombre)}</button>`).join('')}</div></div>`;
    }).join('');
    html += '<p class="muted">Los servicios se hacen uno después del otro, en este orden. Puede ser la misma profesional o una distinta en cada uno.</p>';
  }
  if (!multi && E.l.length && !R.agregando) {
    html += '<h2 id="paso2">2 · ¿Con quién?</h2>';
    if (!aptas.length) {
      html += '<p class="card muted">Ninguna profesional hace todos estos servicios en la misma cita. Quita alguno y resérvalo aparte.</p>';
    } else {
      const lista = barb ? [barb] : aptas;
      html += '<div class="grid">';
      if (!barb && aptas.length > 1) html += `<div class="barb ${R.profesional === '*' ? 'on' : ''}" data-b="*" role="button" tabindex="0"><div class="foto" aria-hidden="true">✦</div><div class="datos"><b>La primera disponible</b><div class="dir">Te mostramos todas las horas libres</div></div></div>`;
      html += lista.map(b => `
        <div class="barb ${b.id === R.profesional ? 'on' : ''}" data-b="${esc(b.id)}" role="button" tabindex="0" aria-pressed="${b.id === R.profesional}">
          ${fotoHtml(b)}
          <div class="datos">
            <b>${esc(b.nombre)}</b>
            <div class="dir">${esc((b.especialidades || []).join(' · ') || 'Todos los servicios')}</div>
            ${mapaBtn(b)}
          </div>
        </div>`).join('') + '</div>';
      if (barb) html += '<button class="link" id="cambiar">← Ver todas</button>' + (barb.galeria ? '<div id="galeria" class="carrusel">' + galeriaHtml(barb) + '</div>' : '');
    }
  }

  const listo = E.l.length && !R.agregando && (multi ? multiOk : R.profesional && aptas.length);
  if (listo) {
    html += '<h2>3 · Día</h2><div class="chips">';
    const hoy = deISO(D.hoy);
    for (let i = 0; i <= D.dias; i++) {
      const d = new Date(hoy); d.setDate(d.getDate() + i);
      const iso = fechaISO(d);
      const off = cerrado(D.horario[d.getDay()]);
      html += `<button class="chip ${iso === R.fecha ? 'on' : ''}" data-f="${iso}" ${off ? 'disabled' : ''}><small>${i === 0 ? 'Hoy' : i === 1 ? 'Mañana' : DIAS[d.getDay()]}</small><b>${d.getDate()}</b><small>${MESES[d.getMonth()]}</small></button>`;
    }
    html += '</div>';
  }
  if (listo && R.fecha) html += '<h2>4 · Hora</h2><div id="horas" class="cargando">Buscando horarios libres…</div>';
  if (listo && R.fecha && R.hora && (!multi || R.plan)) {
    const yo = leerLS('cliente') || {};
    const quien = barb ? barb.nombre : (R.horaCon || 'La primera disponible');
    const segs = multi ? segDePlan(R.plan) : null;
    const quienes = segs ? segs.map(x => x.profesional).filter((v, i, a) => a.indexOf(v) === i).join(', ') : quien;
    const durTot = segs ? aMinW(segs[segs.length - 1].fin) - aMinW(segs[0].hora) : E.dur;
    html += `<h2>5 · Tus datos</h2>
      <div class="card resumen">
        ${segs ? filasSeg(segs) : filasServicios(E, quien, R.hora)}
        <div><span>Con</span><b>${esc(quienes)}</b></div>
        <div><span>Cuándo</span><b>${esc(segs ? cuandoSeg(fechaLarga(R.fecha), segs) : cuandoTxt(fechaLarga(R.fecha), E, quien, R.hora))}</b></div>
        <div><span>Duración${E.l.length > 1 ? ' total' : ''}</span><b>${dur(durTot)}</b></div>
        <div><span>Total</span><b>${precioTxt(E.precio, E.variable)}</b></div>
        ${E.abono ? `<div><span>Abono para confirmar</span><b>${pesos(E.abono)}</b></div>` : ''}
        ${(R.notas || '').trim() ? `<div><span>Tus notas</span><b>${esc(R.notas.trim())}</b></div>` : ''}
      </div>
      ${E.l.length < 6 ? `<div class="acc-serv final"><button class="btn-agregar" data-agregar><span class="mas" aria-hidden="true">+</span>
        <span><b>Agregar otro servicio</b><small>Súmalo a esta misma visita sin perder lo que ya elegiste</small></span></button></div>` : ''}
      <label for="nombre">Nombre</label><input id="nombre" autocomplete="name" value="${esc(R.nombre != null ? R.nombre : yo.nombre || '')}" placeholder="Tu nombre">
      <label for="tel">WhatsApp</label><input id="tel" type="tel" inputmode="numeric" autocomplete="tel" value="${esc(R.tel != null ? R.tel : yo.tel || '')}" placeholder="300 123 4567">
      <div id="err" class="err"></div>
      <button class="btn" id="confirmar">${E.abono ? 'Reservar y ver cómo pagar el abono' : 'Confirmar reserva'}</button>
      <p class="muted">${E.variable ? 'El valor final depende del largo y del estado de tu cabello o uñas. ' : ''}${E.abono ? 'El resto lo pagas en el salón. ' : 'Pagas en el salón. '}${esc(D.advertencia)}</p>`;
  }
  const pistaPrev = $('#pista'), posPrev = pistaPrev ? pistaPrev.scrollLeft : 0;
  v.innerHTML = html;
  iniciarCarrusel(posPrev);
  v.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { R.cat = b.dataset.cat; vistaReservar(); });
  v.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    const id = b.dataset.s, i = R.servicios.indexOf(id);
    if (!R.agregando) R.servicios = [id];
    else if (i >= 0) R.servicios.splice(i, 1);
    else if (R.servicios.length >= 6) { alert('Máximo 6 servicios por cita.'); return; }
    else R.servicios.push(id);
    R.agregando = false; R.hora = null; vistaReservar();
    setTimeout(() => { const p = $('#paso1'); if (p) p.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
  });
  v.querySelectorAll('[data-asig]').forEach(b => b.onclick = () => { R.asig[b.dataset.asig] = b.dataset.pro; R.hora = null; R.plan = null; vistaReservar(); });
  if ($('#cambiar-serv')) $('#cambiar-serv').onclick = () => { R.servicios = []; R.asig = {}; R.plan = null; R.horaCon = ''; R.profesional = null; R.fecha = null; R.hora = null; vistaReservar(); };
  // "Agregar otro servicio" arriba (paso 1) y al final (paso 5): guarda lo escrito y abre la lista.
  v.querySelectorAll('[data-agregar]').forEach(b => b.onclick = () => {
    if ($('#nombre')) R.nombre = $('#nombre').value;
    if ($('#tel')) R.tel = $('#tel').value;
    R.agregando = true; R.hora = null; R.plan = null; vistaReservar();
    setTimeout(() => { const p = $('#paso1'); if (p) p.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
  });
  if ($('#no-agregar')) $('#no-agregar').onclick = () => { R.agregando = false; vistaReservar(); };
  v.querySelectorAll('[data-quitar]').forEach(b => b.onclick = () => { R.servicios = R.servicios.filter(id => id !== b.dataset.quitar); R.agregando = false; R.hora = null; vistaReservar(); });
  if ($('#notas')) $('#notas').oninput = e => { R.notas = e.target.value; };
  if ($('#nombre')) $('#nombre').oninput = e => { R.nombre = e.target.value; };
  if ($('#tel')) $('#tel').oninput = e => { R.tel = e.target.value; };
  if ($('#cambiar')) $('#cambiar').onclick = () => { R.profesional = null; R.fecha = null; R.hora = null; vistaReservar(); };
  v.querySelectorAll('[data-b]').forEach(el => {
    const elegir = () => {
      const cambio = R.profesional !== el.dataset.b;
      if (cambio) { R.profesional = el.dataset.b; R.fecha = null; R.hora = null; }
      vistaReservar();
      if (cambio) setTimeout(() => { const p = $('#paso2'); if (p) p.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
    };
    el.onclick = e => { if (!e.target.closest('[data-mapa]')) elegir(); };
    el.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('[data-mapa]')) { e.preventDefault(); elegir(); } };
  });
  v.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { R.fecha = b.dataset.f; R.hora = null; vistaReservar(); });
  if (listo && R.fecha) cargarHoras();
  if ($('#confirmar')) $('#confirmar').onclick = confirmar;
}

function fechaLarga(iso) {
  const d = deISO(iso);
  const n = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'][d.getDay()];
  return n + ' ' + d.getDate() + ' de ' + ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'][d.getMonth()];
}

let pedidoHoras = 0;
async function cargarHoras() {
  const n = ++pedidoHoras;
  const caja = $('#horas');
  try {
    const multi = R.servicios.length > 1;
    const r = await api(multi ? { a: 'libres', fecha: R.fecha, servicio: R.servicios.join(','), asig: JSON.stringify(R.asig) }
      : { a: 'libres', fecha: R.fecha, profesional: R.profesional, servicio: R.servicios.join(',') });
    if (n !== pedidoHoras || !$('#horas')) return;
    if (!r.libres.length) { caja.className = 'muted'; caja.textContent = multi ? 'Ese día no alcanzan a encadenarse estos servicios con esas profesionales. Prueba otro día o elige "La que esté libre".' : 'No quedan horarios libres ese día para ' + dur(elegidos().dur) + '. Prueba otro día u otra profesional.'; return; }
    if (multi && R.hora) { const s = r.libres.find(x => x.hora === R.hora); if (s) R.plan = s.plan; }
    caja.className = 'horas';
    caja.innerHTML = r.libres.map(s => `<button class="chip ${s.hora === R.hora ? 'on' : ''}" data-h="${s.hora}">${hora12(s.hora).replace(' ', '&nbsp;')}</button>`).join('');
    caja.querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
      R.hora = b.dataset.h;
      const s = r.libres.find(x => x.hora === R.hora);
      R.horaCon = R.profesional === '*' && s && s.profesionales ? s.profesionales.map(id => (D.profesionales.find(p => p.id === id) || {}).nombre).filter(Boolean)[0] || '' : '';
      R.plan = s && s.plan ? s.plan : null;
      vistaReservar();
      setTimeout(() => { const el = $('#nombre'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50);
    });
  } catch (e) {
    if (n === pedidoHoras && $('#horas')) { caja.className = 'err'; caja.textContent = e.message; }
  }
}

async function confirmar() {
  const nombre = $('#nombre').value.trim(), tel = $('#tel').value.replace(/\D/g, '');
  if (nombre.length < 2) return ($('#err').textContent = 'Escribe tu nombre.');
  if (tel.length < 10) return ($('#err').textContent = 'Escribe tu número de WhatsApp (10 dígitos).');
  const btn = $('#confirmar'); btn.disabled = true; btn.textContent = 'Reservando…'; $('#err').textContent = '';
  try {
    const Eres = elegidos(), horaRes = R.hora;
    const multi = R.servicios.length > 1;
    const r = await api(Object.assign({ a: 'reservar', nombre, tel, servicio: R.servicios.join(','), fecha: R.fecha, hora: R.hora, notas: (R.notas || '').trim() },
      multi ? { asig: R.asig } : { profesional: R.profesional }), true);
    // Detalle por servicio: el que manda el servidor (visita) o el calculado aquí (una profesional).
    const segs = r.segmentos || turnosCita(Eres, r.profesional, horaRes).map(x => ({ servicio: x.s.nombre, profesional: r.profesional, hora: deMin(x.ini), fin: deMin(x.fin), precio: x.s.precio, variable: x.s.variable }));
    guardar('cliente', { nombre, tel });
    guardar('ultimaCita', { cita: r.cita, t: r.tel });
    const enlace = location.origin + location.pathname + '?cita=' + r.cita + '&t=' + r.tel;
    const waDest = r.waProfesional || D.whatsapp;
    const msg = 'Hola, reservé en ' + D.negocio + ': ' + (segs.length > 1 ? segs.map(x => x.servicio + ' con ' + x.profesional + ' ' + rangoTxt(aMinW(x.hora), aMinW(x.fin)) + ' (' + precioTxt(x.precio, x.variable) + ')').join(', ') : r.servicio) + ' el ' + r.fechaTxt + ' a las ' + r.hora12 + ' con ' + r.profesional + '. Código ' + r.cita + '.' +
      (r.abono ? ' Te envío el comprobante del abono de ' + pesos(r.abono) + '.' : '');
    $('#v-reservar').innerHTML = `
      <h2>¡Reserva recibida!</h2>
      <div class="card ok">
        <div class="muted">Tu código</div><div class="codigo">${esc(r.cita)}</div>
        <div class="resumen" style="margin-top:8px">
          ${segs.length ? filasSeg(segs) : `<div><span>Servicio</span><b>${esc(r.servicio)}</b></div>`}
          <div><span>Profesional</span><b>${esc(r.profesional)}</b></div>
          <div><span>Dónde</span><b>${esc(r.direccion || D.direccion || '')}</b></div>
          <div><span>Cuándo</span><b>${esc(segs.length ? cuandoSeg(r.fechaTxt, segs) : r.fechaTxt + ', ' + r.hora12)}</b></div>
          <div><span>Duración${Eres.l.length > 1 ? ' total' : ''}</span><b>${dur(r.dur)}</b></div>
          <div><span>Total</span><b>${precioTxt(r.precio, r.variable)}</b></div>
        </div>
      </div>
      ${r.abono ? `<div class="card abono">
        <b>Paga el abono de ${pesos(r.abono)} para confirmar</b>
        <p>${esc(r.datosAbono || 'Escríbenos por WhatsApp y te enviamos los datos para el abono.')}</p>
        ${r.politicaAbono ? `<p class="muted">${esc(r.politicaAbono)}</p>` : ''}
        <p class="muted">Tu cita queda <b>pendiente</b> hasta que el salón reciba el abono.</p>
      </div>` : ''}
      ${r.mapa ? `<a class="btn sec" target="_blank" rel="noopener" href="${esc(r.mapa)}">Cómo llegar (Google Maps)</a>` : ''}
      <p class="muted">${r.abono ? 'Cuando recibamos el abono te confirmamos por WhatsApp.' : 'Te escribiremos por WhatsApp para confirmarla.'} Guarda este enlace para consultar o cancelar tu cita:</p>
      <div class="card" style="word-break:break-all;font-size:13px">${esc(enlace)}</div>
      ${waDest ? `<a class="btn wa" target="_blank" rel="noopener" href="${esc(waLink(waDest, msg))}">${r.abono ? 'Enviar el comprobante por WhatsApp' : 'Avisar por WhatsApp'}</a>` : ''}
      <button class="btn sec" id="otra">Hacer otra reserva</button>`;
    R.notas = '';
    $('#otra').onclick = () => { R.servicios = []; R.asig = {}; R.plan = null; R.profesional = null; R.fecha = null; R.hora = null; R.notas = ''; vistaReservar(); };
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Confirmar reserva';
    $('#err').textContent = e.message;
    if (/ocupar/.test(e.message)) { R.hora = null; cargarHoras(); }
  }
}

/* ---------- Mi cita ---------- */
function vistaMiCita(cita, t) {
  const ult = leerLS('ultimaCita') || {};
  cita = cita || ult.cita || ''; t = t || ult.t || '';
  $('#v-micita').innerHTML = `
    <h2>Consulta tu cita</h2>
    <label for="mc-cita">Código de la cita</label><input id="mc-cita" value="${esc(cita)}" placeholder="CT00012" autocapitalize="characters">
    <label for="mc-tel">WhatsApp con el que reservaste</label><input id="mc-tel" type="tel" inputmode="numeric" value="${esc(t)}" placeholder="300 123 4567">
    <div id="mc-err" class="err"></div>
    <button class="btn" id="mc-buscar">Consultar</button>
    <div id="mc-res"></div>`;
  $('#mc-buscar').onclick = consultar;
  if (cita && t) consultar();
}

async function consultar() {
  const cita = $('#mc-cita').value.trim(), t = $('#mc-tel').value.replace(/\D/g, '');
  if (!cita || t.length < 10) return ($('#mc-err').textContent = 'Escribe el código y tu WhatsApp.');
  $('#mc-err').textContent = ''; $('#mc-res').innerHTML = '<div class="cargando">Buscando…</div>';
  try {
    const r = await api({ a: 'micita', cita, t });
    $('#mc-res').innerHTML = `
      <div class="card ${r.cancelable ? 'ok' : ''}">
        <div class="muted">Hola ${esc(r.cliente)}, tu cita <b>${esc(r.cita)}</b> está:</div>
        <div class="codigo" style="font-size:30px">${esc(r.estado)}</div>
        <div class="resumen">
          ${(() => { // detalle por servicio si se reconocen todos los nombres de la cita
            return r.segmentos && r.segmentos.length ? filasSeg(r.segmentos) : `<div><span>Servicio</span><b>${esc(r.servicio)}</b></div>`;
          })()}
          <div><span>Profesional</span><b>${esc(r.profesional)}</b></div>
          <div><span>Cuándo</span><b>${esc(r.segmentos && r.segmentos.length ? cuandoSeg(r.fechaTxt, r.segmentos) : r.fechaTxt + ', ' + r.hora12 + (r.fin ? ' – ' + hora12(r.fin) : ''))}</b></div>
          <div><span>Dónde</span><b>${esc(r.direccion || D.direccion || '')}</b></div>
          ${r.abono ? `<div><span>Abono</span><b>${r.abonoPagado >= r.abono ? pesos(r.abonoPagado) + ' recibido ✓' : pesos(r.abono) + ' pendiente'}</b></div>` : ''}
        </div>
        ${r.abono && r.abonoPagado < r.abono && r.cancelable ? `<p class="muted">${esc(r.datosAbono)}</p>` : ''}
        ${r.mapa ? `<a class="mapa" target="_blank" rel="noopener" href="${esc(r.mapa)}">Cómo llegar ↗</a>` : ''}
      </div>
      ${r.membresia ? `<div class="card"><b>${esc(r.membresia.plan)}</b><div class="muted">Te quedan ${r.membresia.restantes} servicios · vence el ${esc(r.membresia.vence)}</div></div>` : ''}
      ${r.cancelable ? '<button class="btn sec" id="mc-cancelar">Cancelar esta cita</button>' : ''}`;
    if ($('#mc-cancelar')) $('#mc-cancelar').onclick = async () => {
      if (!confirm('¿Seguro que quieres cancelar la cita ' + r.cita + '?')) return;
      const b = $('#mc-cancelar'); b.disabled = true; b.textContent = 'Cancelando…';
      try { await api({ a: 'cancelar', cita, t }, true); consultar(); }
      catch (e) { b.disabled = false; b.textContent = 'Cancelar esta cita'; $('#mc-err').textContent = e.message; }
    };
  } catch (e) { $('#mc-res').innerHTML = ''; $('#mc-err').textContent = e.message; }
}

/* ---------- Planes ---------- */
function vistaPlanes() {
  $('#v-planes').innerHTML = '<h2>Planes mensuales <small>pagas una vez, vienes varias</small></h2>' + D.planes.map(p => `
    <div class="card plan">
      <h3>${esc(p.nombre)}</h3>
      <div class="precio">${pesos(p.precio)}</div>
      <div class="muted">${p.usos} servicios · válido ${p.dias} días</div>
      <ul>${p.incluye.map(s => '<li>' + esc(s) + '</li>').join('')}</ul>
      ${D.whatsapp ? `<a class="btn wa" target="_blank" rel="noopener" href="${esc(waLink(D.whatsapp, 'Hola, quiero el ' + p.nombre + ' (' + pesos(p.precio) + ').'))}">Lo quiero</a>` : ''}
    </div>`).join('') + '<p class="muted">El plan se activa en el salón al pagar.</p>';
}

/* ---------- Inicio ---------- */
function pintarDatos() {
  document.title = D.negocio + ' · Reserva tu cita';
  $('#lema').textContent = D.ciudad || '';
  const horas = D.horario.map((h, i) => DIAS[i] + ' ' + (cerrado(h) ? 'cerrado' : h.replace('-', '–'))).slice(1).concat(DIAS[0] + ' ' + (cerrado(D.horario[0]) ? 'cerrado' : D.horario[0].replace('-', '–')));
  $('#info').innerHTML = esc(D.direccion) + (D.ciudad ? ', ' + esc(D.ciudad) : '') + '<br>' + esc(horas.join(' · '));
  if (D.whatsapp) { const s = $('#soporte'); s.href = waLink(D.whatsapp, 'Hola, tengo una pregunta.'); s.classList.remove('hidden'); }
}

(async function iniciar() {
  const q = new URLSearchParams(location.search);
  const previo = leerLS('datos');
  if (previo) { D = previo; D.hoy = fechaISO(new Date()); pintarDatos(); vistaReservar(); }
  try {
    const r = await api({ a: 'datos' });
    D = r; guardar('datos', r); pintarDatos();
    if (!q.get('cita')) vistaReservar();
    cargarFotos();
    cargarFotosServ();
  } catch (e) {
    if (!previo) $('#v-reservar').innerHTML = '<div class="err">' + esc(e.message) + '</div><button class="btn sec" onclick="location.reload()">Reintentar</button>';
  }
  if (q.get('cita') && D) { tab('micita'); vistaMiCita(q.get('cita'), q.get('t')); }
})();
</script>
