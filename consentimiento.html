<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beauty Glam · Consentimiento informado</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17110e">
<link rel="icon" href="image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #17110e; --card: #221915; --card2: #2e231e; --line: #403128; --txt: #f6efea; --sub: #c4b1a6; --acc: #cfb2a5; --acc-txt: #2b170f; --ok: #2fbf71; --err: #ff6b6b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); font: 15px/1.5 Inter, system-ui, sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  header { padding: 18px 16px 4px; text-align: center; background: linear-gradient(90deg, #7a5f52, #cfb2a5, #7a5f52) top / 100% 4px no-repeat; }
  header img { width: min(150px, 40vw); height: auto; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 60px; }
  h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; margin: 10px 0 2px; }
  h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; margin: 22px 0 8px; }
  .muted { color: var(--sub); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
  .q { padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .q:last-child { border-bottom: 0; }
  .q p { margin: 0 0 8px; }
  .sino { display: flex; gap: 8px; }
  .sino button { flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card2); cursor: pointer; font-weight: 600; }
  .sino button.on { background: var(--acc); color: var(--acc-txt); border-color: var(--acc); }
  input[type=text], textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card2); }
  label { display: block; margin: 12px 0 6px; color: var(--sub); font-size: 14px; }
  .texto { font-size: 14px; color: var(--txt); }
  .firma { position: relative; margin-top: 8px; border: 2px dashed var(--acc); border-radius: 12px; background: #fbf7f4; touch-action: none; }
  .firma canvas { display: block; width: 100%; height: 180px; border-radius: 10px; }
  .firma span { position: absolute; left: 12px; bottom: 8px; color: #9b8a80; font-size: 12px; pointer-events: none; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; font-size: 14px; }
  .check input { width: 22px; height: 22px; accent-color: var(--acc); flex: none; margin-top: 1px; }
  .btn { display: block; width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 12px; background: var(--acc); color: var(--acc-txt); font-weight: 700; font-size: 16px; cursor: pointer; }
  .btn:disabled { opacity: .5; }
  .link { background: none; border: 0; color: var(--acc); font-weight: 600; cursor: pointer; padding: 6px 0; }
  .err { color: var(--err); margin-top: 10px; min-height: 1em; }
  .ok { border-color: #2f4a37; background: #1d2a21; text-align: center; }
  .ok b { font-size: 18px; }
  .tag { display: inline-block; background: var(--acc); color: var(--acc-txt); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; margin: 2px 4px 2px 0; }
</style>
</head>
<body>
<header><img src="logo.png" alt="Beauty Glam by Nathaly Torres" width="520" height="520"></header>
<div class="wrap" id="app"><p class="muted" style="text-align:center;margin-top:30px">Cargando…</p></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbxdYsJMpAHYGTf5ObuPCoIRMS4yYKSpGW1SMGNja7iLVml2JO9O4btmWzf46nWLR7EdDA/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const qs = new URLSearchParams(location.search);
const CITA = qs.get('cita') || '', TEL = qs.get('t') || '', SALON = qs.get('salon') === '1';

async function api(params, post) {
  let ultimo;
  for (let i = 0; i < 4; i++) {
    try {
      const r = post ? await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(params) })
        : await fetch(API + '?' + new URLSearchParams(params));
      const j = await r.json();
      if (!j.ok) { const e = new Error(j.error || 'Error'); e.final = true; throw e; }
      return j;
    } catch (e) { if (e.final) throw e; ultimo = e; await new Promise(res => setTimeout(res, 800 * (i + 1))); }
  }
  throw new Error('No pudimos conectar. Revisa tu internet e inténtalo de nuevo.');
}

const R = {};
async function iniciar() {
  if (!CITA || !TEL) { $('#app').innerHTML = '<h1>Consentimiento</h1><p class="muted">Abre este formulario desde el enlace que te enviamos por WhatsApp.</p>'; return; }
  let d;
  try { d = await api({ a: 'consent', cita: CITA, t: TEL }); }
  catch (e) { $('#app').innerHTML = `<h1>Consentimiento</h1><div class="err">${esc(e.message)}</div>`; return; }
  if (!d.categorias.length) { $('#app').innerHTML = `<h1>¡Todo listo!</h1><p class="muted">Tu cita (${esc(d.servicios)}) no necesita consentimiento.</p>`; return; }
  if (d.firmado) { $('#app').innerHTML = `<h1>Consentimiento</h1><div class="card ok"><b>✓ Ya está firmado</b><p class="muted">Tienes vigente el consentimiento de ${esc(d.categorias.join(', '))}. ¡Te esperamos!</p></div>`; return; }
  if (d.alergias) R.alergias = d.alergias;
  $('#app').innerHTML = `
    <h1>Consentimiento informado</h1>
    <p class="muted">Hola ${esc(d.cliente.split(' ')[0])}, antes de tu servicio necesitamos unos datos de salud y tu firma. Toma 2 minutos.</p>
    <div class="card"><div class="muted">Servicio</div><b>${esc(d.servicios)}</b><div style="margin-top:6px">${d.categorias.map(c => `<span class="tag">${esc(c)}</span>`).join('')}</div></div>
    <h2>Tu salud</h2>
    <div class="card">${d.preguntas.map(q => `<div class="q"><p>${esc(q.t)}</p>${q.tipo === 'sino'
      ? `<div class="sino" data-q="${esc(q.k)}"><button type="button" data-v="No">No</button><button type="button" data-v="Sí">Sí</button></div>`
      : `<input type="text" data-t="${esc(q.k)}" maxlength="200" placeholder="Escribe &quot;Ninguna&quot; si no tienes" value="${esc(R[q.k] || '')}">`}</div>`).join('')}</div>
    <h2>Autorización</h2>
    <div class="card texto">${esc(d.texto)}</div>
    <label for="nombre">Nombre completo</label><input type="text" id="nombre" maxlength="80" autocomplete="name" value="${esc(d.cliente)}">
    <label for="doc">Documento de identidad (opcional)</label><input type="text" id="doc" maxlength="20" inputmode="numeric">
    <label>Firma aquí con el dedo</label>
    <div class="firma"><canvas id="lienzo"></canvas><span>Firma de ${esc(d.cliente.split(' ')[0])}</span></div>
    <button type="button" class="link" id="borrar">Borrar firma</button>
    <label class="check"><input type="checkbox" id="acepto"><span>Leí y acepto el consentimiento informado y confirmo que mis respuestas son verdaderas.</span></label>
    <div class="err" id="err"></div>
    <button class="btn" id="enviar">Firmar y enviar</button>`;
  document.querySelectorAll('.sino').forEach(g => g.querySelectorAll('button').forEach(b => b.onclick = () => {
    g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); R[g.dataset.q] = b.dataset.v;
  }));
  const firma = lienzo($('#lienzo'));
  $('#borrar').onclick = firma.borrar;
  $('#enviar').onclick = async () => {
    $('#err').textContent = '';
    const respuestas = {};
    d.preguntas.forEach(q => { respuestas[q.k] = q.tipo === 'sino' ? (R[q.k] || '') : (document.querySelector(`[data-t="${q.k}"]`).value.trim() || 'Ninguna'); });
    const falta = d.preguntas.find(q => q.tipo === 'sino' && !respuestas[q.k]);
    if (falta) { $('#err').textContent = 'Responde todas las preguntas de salud.'; return; }
    if (!firma.usada()) { $('#err').textContent = 'Firma en el recuadro.'; return; }
    if (!$('#acepto').checked) { $('#err').textContent = 'Marca que aceptas el consentimiento.'; return; }
    const b = $('#enviar'); b.disabled = true; b.textContent = 'Enviando…';
    try {
      const r = await api({ a: 'consentFirmar', cita: CITA, t: TEL, nombre: $('#nombre').value, documento: $('#doc').value, respuestas, firma: firma.imagen(), acepto: true, salon: SALON }, true);
      $('#app').innerHTML = `<h1>¡Gracias!</h1><div class="card ok"><b>✓ ${esc(r.texto)}</b><p class="muted">Te esperamos en ${esc(d.negocio)}.</p></div>`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) { b.disabled = false; b.textContent = 'Firmar y enviar'; $('#err').textContent = e.message; }
  };
}

/** Lienzo de firma (dedo o mouse). */
function lienzo(cv) {
  const ctx = cv.getContext('2d');
  let usado = false, dib = false, ult = null;
  const ajustar = () => {
    const r = cv.getBoundingClientRect(), k = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width * k); cv.height = Math.round(r.height * k);
    ctx.setTransform(k, 0, 0, k, 0, 0); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#2b170f';
    usado = false;
  };
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', e => { dib = true; ult = pos(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
  cv.addEventListener('pointermove', e => {
    if (!dib) return; const p = pos(e);
    ctx.beginPath(); ctx.moveTo(ult[0], ult[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); ult = p; usado = true; e.preventDefault();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, () => { dib = false; }));
  ajustar();
  return {
    borrar: () => { ctx.clearRect(0, 0, cv.width, cv.height); usado = false; },
    usada: () => usado,
    // Firma liviana: se reduce a 480 px de ancho, fondo blanco, JPEG.
    imagen: () => {
      const w = 480, h = Math.round(cv.height * w / cv.width);
      const o = document.createElement('canvas'); o.width = w; o.height = h;
      const c2 = o.getContext('2d'); c2.fillStyle = '#fff'; c2.fillRect(0, 0, w, h); c2.drawImage(cv, 0, 0, w, h);
      return o.toDataURL('image/jpeg', 0.6);
    }
  };
}
iniciar();
</script>
</body>
</html>
